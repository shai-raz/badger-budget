# Builds the production image (see Dockerfile) for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/<owner>/badger-budget: :latest and a sha tag on every push to main, plus X.Y.Z and X.Y when the commit
# carries a v*.*.* tag.
# Releases build once: release.yml pushes the release commit and its tag atomically, so the main-push run for that
# commit already sees the tag and publishes the semver tags too. Tag pushes do not trigger a second build of the
# same commit. To rebuild a release by hand, run this workflow on its tag (workflow_dispatch).
# Images carry APP_VERSION (from `git describe --tags`) and GIT_SHA build args: release builds report vX.Y.Z (the
# API strips the v), main builds after a tag report vX.Y.Z-N-g<sha>.
# Pull requests build without pushing, so a broken Dockerfile fails the PR.
# The Dockerfile's JS build stage runs on $BUILDPLATFORM, so only native deps run under QEMU.
# The repository.private guards below only matter if the repo is made private again: pushes then skip the job
# (no GHCR push, no multi-arch build), and PRs build linux/amd64 only and skip QEMU, to save Actions minutes.

name: Docker publish

on:
    push:
        branches: [main]
    pull_request:
        paths:
            - Dockerfile
            - .dockerignore
            - docker/**
            - apps/**
            - packages/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - turbo.json
            - .github/workflows/docker-publish.yml
    workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build & publish image
        # Pushes from a private repo skip the job entirely (no QEMU build either). Pull requests always run.
        if: github.event_name == 'pull_request' || github.event.repository.private == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history and tags, so `git describe` can name the version

            # GHCR requires a lowercase owner; derive it from the repo so forks publish to their own namespace.
            - name: Compute image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/badger-budget" >> "$GITHUB_ENV"

            - uses: docker/setup-qemu-action@v3
              if: github.event.repository.private == false

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request' && github.event.repository.private == false
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: version
              name: Resolve app version and commit
              run: |
                  echo "app_version=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
                  echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  # The release tag on this exact commit, if any (empty for ordinary main pushes and PRs).
                  echo "release_tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)" >> "$GITHUB_OUTPUT"

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}},value=${{ steps.version.outputs.release_tag }},enable=${{ steps.version.outputs.release_tag != '' }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.release_tag }},enable=${{ steps.version.outputs.release_tag != '' }}
                      type=sha

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ github.event.repository.private && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
                  push: ${{ github.event_name != 'pull_request' && github.event.repository.private == false }}
                  build-args: |
                      APP_VERSION=${{ steps.version.outputs.app_version }}
                      GIT_SHA=${{ steps.version.outputs.git_sha }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
