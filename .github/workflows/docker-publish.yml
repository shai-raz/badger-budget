# Builds the production image (see Dockerfile) for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/<owner>/badger-budget: :latest on main, semver tags on v*.*.* tags, sha tags on every push.
# The v*.*.* tags are pushed by release.yml, which tags each release on main.
# Pull requests build without pushing, so a broken Dockerfile fails the PR.
# The Dockerfile's JS build stage runs on $BUILDPLATFORM, so only native deps run under QEMU.
# The repository.private guards below only matter if the repo is made private again: pushes then skip the job
# (no GHCR push, no multi-arch build), and PRs build linux/amd64 only and skip QEMU, to save Actions minutes.

name: Docker publish

on:
    push:
        branches: [main]
        tags: ["v*.*.*"]
    pull_request:
        paths:
            - Dockerfile
            - .dockerignore
            - docker/**
            - apps/**
            - packages/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - turbo.json
            - .github/workflows/docker-publish.yml
    workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build & publish image
        # Pushes from a private repo skip the job entirely (no QEMU build either). Pull requests always run.
        if: github.event_name == 'pull_request' || github.event.repository.private == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # GHCR requires a lowercase owner; derive it from the repo so forks publish to their own namespace.
            - name: Compute image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/badger-budget" >> "$GITHUB_ENV"

            - uses: docker/setup-qemu-action@v3
              if: github.event.repository.private == false

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request' && github.event.repository.private == false
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ github.event.repository.private && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
                  push: ${{ github.event_name != 'pull_request' && github.event.repository.private == false }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
