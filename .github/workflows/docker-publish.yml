# Builds the production image (see Dockerfile) for linux/amd64 and linux/arm64.
#
# Releases: release.yml calls this workflow (workflow_call) with the release tag after pushing it, and publishes the
# GitHub release only once this succeeds, so nothing announces a version whose image is missing. It pushes
# ghcr.io/<owner>/badger-budget:X.Y.Z, plus :X.Y and :latest when the tag is the newest in its minor line or overall.
# Main pushes build nothing: :latest is always the latest release.
# To rebuild a release by hand, run this workflow (workflow_dispatch) with its tag.
# Images carry APP_VERSION (from `git describe --tags`, so vX.Y.Z; the API strips the v) and GIT_SHA build args.
#
# Pull requests touching the files the image is built from build without pushing, so a broken Dockerfile fails the
# PR. Add any new file the Dockerfile copies to the paths list.
# The Dockerfile's JS build stage runs on $BUILDPLATFORM, so only native deps run under QEMU.
# The repository.private guards below only matter if the repo is made private again: releases then skip the job
# (no GHCR push, no multi-arch build), and PRs build linux/amd64 only and skip QEMU, to save Actions minutes.

name: Docker publish

on:
    pull_request:
        paths:
            - Dockerfile
            - .dockerignore
            - .npmrc
            - docker/**
            - apps/**
            - packages/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - turbo.json
            - .github/workflows/docker-publish.yml
    workflow_call:
        inputs:
            tag:
                description: Release tag to build and push, e.g. v1.2.3
                required: true
                type: string
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to rebuild and push, e.g. v1.2.3
                required: true
                type: string

jobs:
    build:
        name: Build & publish image
        # A private repo builds only pull requests (no QEMU build, no push). Pull requests always run.
        if: github.event_name == 'pull_request' || github.event.repository.private == false
        runs-on: ubuntu-latest
        # Job-level so a call from release.yml (whose `github` context is the caller's) cannot share a group with it.
        # PRs cancel superseded runs; a release build is never cancelled.
        concurrency:
            group: docker-publish-${{ github.event_name == 'pull_request' && github.head_ref || inputs.tag }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        permissions:
            contents: read
            packages: write
        env:
            RELEASE_TAG: ${{ inputs.tag }}
            PUSH: ${{ github.event_name != 'pull_request' }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # The release tag for releases; the PR merge commit otherwise.
                  ref: ${{ inputs.tag }}
                  fetch-depth: 0 # full history and tags, so `git describe` can name the version

            # GHCR requires a lowercase owner; derive it from the repo so forks publish to their own namespace.
            - name: Compute image name
              run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/badger-budget" >> "$GITHUB_ENV"

            - id: version
              name: Resolve app version, commit and image tags
              run: |
                  echo "app_version=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
                  echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  if [ "$PUSH" != "true" ]; then
                      exit 0
                  fi

                  if ! [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                      echo "::error::'$RELEASE_TAG' is not a vX.Y.Z tag"
                      exit 1
                  fi
                  major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                  if ! git tag --points-at HEAD | grep -qxF "$RELEASE_TAG"; then
                      echo "::error::$RELEASE_TAG is not a tag on the checked-out commit"
                      exit 1
                  fi

                  newest_tag() { git tag --list "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1; }
                  newest_in_minor=false
                  newest=false
                  if [ "$RELEASE_TAG" = "$(newest_tag "v$major_minor.*")" ]; then newest_in_minor=true; fi
                  if [ "$RELEASE_TAG" = "$(newest_tag 'v*')" ]; then newest=true; fi
                  {
                      echo "version=${RELEASE_TAG#v}"
                      echo "major_minor=$major_minor"
                      echo "newest_in_minor=$newest_in_minor"
                      echo "newest=$newest"
                  } >> "$GITHUB_OUTPUT"

            # X.Y and latest move only to the newest tag, so rebuilding an old release cannot move them back.
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  flavor: latest=false
                  tags: |
                      type=raw,value=${{ steps.version.outputs.version }},enable=${{ env.PUSH == 'true' }}
                      type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.newest_in_minor == 'true' }}
                      type=raw,value=latest,enable=${{ steps.version.outputs.newest == 'true' }}
                      type=ref,event=pr

            - uses: docker/setup-qemu-action@v3
              if: github.event.repository.private == false

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              if: env.PUSH == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ github.event.repository.private && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
                  push: ${{ env.PUSH == 'true' }}
                  build-args: |
                      APP_VERSION=${{ steps.version.outputs.app_version }}
                      GIT_SHA=${{ steps.version.outputs.git_sha }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
