# Fails a pull request whose title is not a Conventional Commit title. PRs are squash-merged, so the title becomes the
# commit subject that release.yml reads to pick the next version and write the changelog. The check is named
# "PR title" so the owner can make it a required status check. The title goes in through env, never into the script.

name: PR title

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: pr-title-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    pr-title:
        name: PR title
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version

            - name: Check the title is a Conventional Commit
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: node packages/release/bin/check-title.mjs
