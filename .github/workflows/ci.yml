name: CI

on:
    pull_request:
    push:
        branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    format:
        name: Prettier
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Reads the pnpm version from `packageManager` in package.json.
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # `--ignore-scripts` skips postinstall hooks — Puppeteer's Chrome
            # download, `nuxt prepare`, and lefthook's git-hook install. None of
            # them matter to Prettier, and the Chrome download dominates runtime.
            - run: pnpm install --frozen-lockfile --ignore-scripts

            - run: pnpm format:check

    web:
        name: Web lint & type-check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # `--ignore-scripts` skips Puppeteer's Chrome download; web's
            # postinstall steps (build @badger/shared-data, then `nuxt prepare`)
            # run explicitly below.
            - run: pnpm install --frozen-lockfile --ignore-scripts

            # nuxt.config.ts imports runtime values from @badger/shared-data,
            # which loads from its compiled dist/.
            - run: pnpm --filter @badger/shared-data build

            # eslint.config.mjs imports ./.nuxt/eslint.config.mjs, so .nuxt must
            # exist before linting.
            - run: pnpm --filter web exec nuxt prepare

            - run: pnpm --filter web lint

            # Through turbo so `^build` builds the shared packages first (bare
            # `pnpm --filter web check-types` would read stale/missing dist/).
            - run: pnpm check-types --filter=web

    changes:
        name: Changes
        runs-on: ubuntu-latest
        outputs:
            app: ${{ steps.filter.outputs.app }}
        steps:
            - uses: actions/checkout@v4

            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      app:
                          - 'apps/web/**'
                          - 'apps/api/**'
                          - 'packages/**'
                          - 'e2e/**'
                          - 'package.json'
                          - 'pnpm-lock.yaml'

    e2e:
        name: E2E
        needs: changes
        # A job-level skip reports as skipped, which passes a required check; a workflow-level paths filter would leave it pending.
        if: needs.changes.outputs.app == 'true'
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: badger
                    POSTGRES_PASSWORD: badger_password
                    POSTGRES_DB: badger_e2e
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U badger -d badger_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            PUPPETEER_SKIP_DOWNLOAD: 1
            LEFTHOOK: 0
            E2E_DATABASE_URL: postgresql://badger:badger_password@localhost:5432/badger_e2e
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter api exec prisma generate

            - run: pnpm exec playwright install --with-deps chromium

            - run: pnpm exec tsc -p e2e/tsconfig.json

            - run: pnpm test:e2e

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/

    test:
        name: Tests
        runs-on: ubuntu-latest
        # No database service: every spec mocks PrismaService.
        env:
            PUPPETEER_SKIP_DOWNLOAD: 1
            LEFTHOOK: 0
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # Install scripts must run here (unlike the jobs above): they build bcrypt's
            # native binding, the israeli-bank-scrapers git dependency (its `prepare`),
            # @badger/shared-data (web's postinstall), and web's `.nuxt` (`nuxt prepare`).
            # PUPPETEER_SKIP_DOWNLOAD skips the Chrome download, as in the Dockerfile.
            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter api exec prisma generate

            # Jest (api) + Vitest (web), through turbo so `^build` builds the shared
            # packages first.
            - run: pnpm test
