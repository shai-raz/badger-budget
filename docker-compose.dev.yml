services:
    postgres:
        image: postgres:16-alpine
        container_name: badger-postgres
        restart: unless-stopped
        ports:
            - "5433:5432"
        environment:
            POSTGRES_USER: badger
            POSTGRES_PASSWORD: badger_password
            POSTGRES_DB: badger_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U badger -d badger_db"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Opt-in local S3 stand-in for transaction attachments. Start with `--profile attachments`. Dev credentials only.
    s3proxy:
        image: andrewgaul/s3proxy:4.1.1
        container_name: badger-s3proxy
        profiles: ["attachments"]
        restart: unless-stopped
        ports:
            - "9000:9000"
        environment:
            S3PROXY_AUTHORIZATION: aws-v2-or-v4
            S3PROXY_IDENTITY: badger-dev
            S3PROXY_CREDENTIAL: badger-dev-secret
            S3PROXY_ENDPOINT: http://0.0.0.0:9000
            JCLOUDS_PROVIDER: filesystem
            JCLOUDS_FILESYSTEM_BASEDIR: /data
        volumes:
            - s3proxy_data:/data

volumes:
    postgres_data:
        driver: local
    s3proxy_data:
        driver: local
