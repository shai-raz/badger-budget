# Badger Budget for Coolify: app + Postgres 16 + nightly backups.
# Coolify: + New -> Public Repository, build pack Docker Compose, location /deploy/coolify/docker-compose.yml
# (README "Coolify"). It also works pasted into + New -> Docker Compose Empty. No edits needed.
# Coolify generates the domain and the database credentials (SERVICE_* magic variables).
# Differs from the root docker-compose.yml: no host ports or Caddy (Coolify's proxy routes and terminates TLS),
# and a backups volume instead of ./backups. Keep the app's environment list in sync with the root file
# (apps/api/src/config/compose-env-parity.spec.ts enforces it).
# Optional features: fill the empty variables on the Environment Variables tab (see README "Optional features").

services:
    app:
        image: ghcr.io/shai-raz/badger-budget:latest
        # Re-pull :latest on every deploy. Coolify pulls on its own, but other compose-based hosts (e.g. Dokploy) only
        # run `docker compose up`, which keeps the cached image, so a redeploy would restart the old version.
        pull_policy: always
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - app_data:/data
        environment:
            - SERVICE_URL_APP_8080
            - PUBLIC_URL=${SERVICE_URL_APP}
            - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
            - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/badger
            - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-}
            - FREE_CURRENCY_API_KEY=${FREE_CURRENCY_API_KEY:-}
            - GOOGLE_SHEETS_TYPE=${GOOGLE_SHEETS_TYPE:-}
            - GOOGLE_SHEETS_PROJECT_ID=${GOOGLE_SHEETS_PROJECT_ID:-}
            - GOOGLE_SHEETS_PRIVATE_KEY_ID=${GOOGLE_SHEETS_PRIVATE_KEY_ID:-}
            - GOOGLE_SHEETS_PRIVATE_KEY=${GOOGLE_SHEETS_PRIVATE_KEY:-}
            - GOOGLE_SHEETS_CLIENT_EMAIL=${GOOGLE_SHEETS_CLIENT_EMAIL:-}
            - GOOGLE_SHEETS_CLIENT_ID=${GOOGLE_SHEETS_CLIENT_ID:-}
            - BROWSERLESS_URL=${BROWSERLESS_URL:-}
            - CAL_PROXY_URL=${CAL_PROXY_URL:-}
            - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
            - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
            - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
            - R2_BUCKET=${R2_BUCKET:-}
            - R2_PRESIGN_TTL=${R2_PRESIGN_TTL:-604800}
            - STORE_SCRAPER_DEBUG_LOCALLY=${STORE_SCRAPER_DEBUG_LOCALLY:-}
            - SEED_DEMO=${SEED_DEMO:-}
            - JWT_SECRET=${JWT_SECRET:-}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
            - CREDENTIAL_ENCRYPTION_PEPPER=${CREDENTIAL_ENCRYPTION_PEPPER:-}
            - UPDATE_CHECK=${UPDATE_CHECK:-}
            - UPDATE_CHECK_REPO=${UPDATE_CHECK_REPO:-}
            - DEPLOY_WEBHOOK_URL=${DEPLOY_WEBHOOK_URL:-}
            - DEPLOY_WEBHOOK_TOKEN=${DEPLOY_WEBHOOK_TOKEN:-}
            - DEPLOY_WEBHOOK_TOKEN_HEADER=${DEPLOY_WEBHOOK_TOKEN_HEADER:-}
            - DEPLOY_WEBHOOK_BODY=${DEPLOY_WEBHOOK_BODY:-}

    db:
        image: postgres:16
        restart: unless-stopped
        volumes:
            - pgdata:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=${SERVICE_USER_POSTGRES}
            - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
            - POSTGRES_DB=badger
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Daily dumps (7 daily, 4 weekly, 6 monthly) into the `backups` volume. Delete this service to turn them off.
    backup:
        image: prodrigestivill/postgres-backup-local:16
        restart: unless-stopped
        # Root, so the backups volume is writable whatever its ownership.
        user: "0:0"
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - backups:/backups
        environment:
            - POSTGRES_HOST=db
            - POSTGRES_DB=badger
            - POSTGRES_USER=${SERVICE_USER_POSTGRES}
            - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
            - SCHEDULE=@daily
            - BACKUP_KEEP_DAYS=7
            - BACKUP_KEEP_WEEKS=4
            - BACKUP_KEEP_MONTHS=6

volumes:
    app_data: {}
    pgdata: {}
    backups: {}
